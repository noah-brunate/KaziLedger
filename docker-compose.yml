services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kaziledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaziledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
